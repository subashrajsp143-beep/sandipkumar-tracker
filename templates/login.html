<!DOCTYPE html>
<html lang="hi" class="min-h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>लॉगिन — M/S SANDIP KUMAR पोर्टल</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css?v=1.0">
    <style>
        html {
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="min-h-screen bg-[#F0FDF4] text-[#052E16] flex flex-col items-center justify-center p-4 py-8">

    <!-- Header / Brand with Official Option 2 Logo -->
    <div class="w-full max-w-md text-center mb-6">
        <div class="w-16 h-16 rounded-2xl bg-white shadow-sm flex items-center justify-center p-1 mx-auto mb-3 border border-slate-200">
            <img src="/static/icons/icon-192.png?v=2.0" alt="M/S Sandip Kumar" class="w-full h-full object-contain rounded-xl">
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">M/S SANDIP KUMAR</h1>
        <p class="text-xs font-bold text-slate-600 mt-0.5">२१ जलापूर्ति साइट्स पोर्टल</p>
    </div>

    <!-- Login Container Card -->
    <div class="w-full max-w-md bg-white rounded-lg p-6 sm:p-8 border border-[#C7E6D1]">
        
        <!-- Role Tabs -->
        <div class="grid grid-cols-3 gap-1 p-1 bg-[#F0FDF4] rounded-md mb-6 border border-[#C7E6D1] text-center text-xs font-medium">
            <button type="button" id="tabWorkerBtn" onclick="switchTab('worker')" 
                    class="py-2.5 rounded-xl bg-indigo-600 text-white shadow-sm transition">
                👷 वर्कर
            </button>
            <button type="button" id="tabSupervisorBtn" onclick="switchTab('supervisor')" 
                    class="py-2.5 rounded-xl text-[#4B6B57] hover:text-white transition">
                📋 सुपरवाइज़र
            </button>
            <button type="button" id="tabOwnerBtn" onclick="switchTab('owner')" 
                    class="py-2.5 rounded-xl text-[#4B6B57] hover:text-white transition">
                🏢 ऑफिस वर्क
            </button>
        </div>

        <!-- 1. WORKER LOGIN FORM -->
        <form id="workerForm" onsubmit="handleWorkerLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-[#052E16] mb-1 font-medium">आपकी साइट (Work Site) *</label>
                <select id="wSiteId" required class="w-full px-3.5 py-3 rounded-xl bg-white border border-[#C7E6D1] text-[#052E16] text-sm font-semibold focus:ring-2 focus:ring-indigo-500">
                    <option value="">-- साइट चुनें --</option>
                    {% for s in sites %}
                    <option value="{{ s.id }}">{{ s.name }} ({{ s.code }})</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-[#052E16] mb-1 font-medium">आपका कार्य / पद (Work Role) *</label>
                <select id="wRole" required class="w-full px-3.5 py-3 rounded-xl bg-white border border-[#C7E6D1] text-[#052E16] text-sm font-semibold focus:ring-2 focus:ring-indigo-500">
                    <option value="Data Entry">डाटा एंट्री ऑपरेटर (Data Entry / DEO)</option>
                    <option value="Plumber">प्लंबर (Plumber)</option>
                    <option value="Helper">हेल्पर / मजदूर (Helper)</option>
                    <option value="GI Mistri">जी.आई. मिस्त्री (GI Mistri)</option>
                    <option value="Electrician">इलेक्ट्रीशियन (Electrician)</option>
                    <option value="Fitter">फिटर (Fitter)</option>
                    <option value="Other">अन्य (Other)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-[#052E16] mb-1 font-medium">आपका पूरा नाम *</label>
                <input type="text" id="wName" required placeholder="उदा. संतोष कुमार" 
                       class="w-full px-3.5 py-3 rounded-xl bg-white border border-[#C7E6D1] text-[#052E16] text-sm font-semibold focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-[#052E16] mb-1 font-medium">मोबाइल नंबर *</label>
                <input type="tel" id="wPhone" required placeholder="उदा. 9876543210" maxlength="10"
                       class="w-full px-3.5 py-3 rounded-xl bg-white border border-[#C7E6D1] text-[#052E16] text-sm font-semibold focus:ring-2 focus:ring-indigo-500">
                <span class="text-[10px] text-[#4B6B57] mt-1 block">यह फोन नंबर एक बार सेव रहेगा ताकि आपको बार-बार लॉगिन न करना पड़े।</span>
            </div>

            <button type="submit" id="wLoginBtn" class="w-full btn-cta">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>लॉगिन करें (मेरी हाजिरी)</span>
            </button>
        </form>

        <!-- 2. SUPERVISOR / SITE INCHARGE LOGIN FORM -->
        <form id="supervisorForm" onsubmit="handleSupervisorLogin(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-bold text-[#052E16] mb-1 font-medium">आपकी साइट (Site Incharge / Supervisor) *</label>
                <select id="supSiteId" required class="w-full px-3.5 py-3 rounded-xl bg-white border border-[#C7E6D1] text-[#052E16] text-sm font-semibold focus:ring-2 focus:ring-teal-500">
                    <option value="">-- साइट चुनें --</option>
                    {% for s in sites %}
                    <option value="{{ s.id }}">{{ s.name }} ({{ s.code }})</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-[#052E16] mb-1 font-medium">पद (Role) *</label>
                <select id="supRole" required class="w-full px-3.5 py-3 rounded-xl bg-white border border-[#C7E6D1] text-[#052E16] text-sm font-semibold focus:ring-2 focus:ring-teal-500">
                    <option value="Supervisor">सुपरवाइज़र (Supervisor)</option>
                    <option value="Site Incharge">साइट इनचार्ज (Site Incharge)</option>
                    <option value="Data Entry">डाटा एंट्री ऑपरेटर (DEO)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-[#052E16] mb-1 font-medium">सुपरवाइज़र का नाम *</label>
                <input type="text" id="supName" required placeholder="उदा. रमेश सिंह" 
                       class="w-full px-3.5 py-3 rounded-xl bg-white border border-[#C7E6D1] text-[#052E16] text-sm font-semibold focus:ring-2 focus:ring-teal-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-[#052E16] mb-1 font-medium">मोबाइल नंबर *</label>
                <input type="tel" id="supPhone" required placeholder="उदा. 9876543210" maxlength="10"
                       class="w-full px-3.5 py-3 rounded-xl bg-white border border-[#C7E6D1] text-[#052E16] text-sm font-semibold focus:ring-2 focus:ring-teal-500">
            </div>

            <button type="submit" id="supLoginBtn" class="w-full btn-cta">
                <i class="fa-solid fa-boxes-stacked"></i>
                <span>सुपरवाइज़र पोर्टल (स्टॉक व दैनिक एंट्री)</span>
            </button>
        </form>

        <!-- 3. OFFICE WORK LOGIN FORM (Sandip@@12) -->
        <form id="ownerForm" onsubmit="handleOwnerLogin(event)" class="space-y-4 hidden">
            <div class="text-center py-2">
                <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-800 flex items-center justify-center text-xl mx-auto mb-2 border border-emerald-300">
                    <i class="fa-solid fa-building-user"></i>
                </div>
                <h3 class="text-sm font-extrabold text-slate-900">ऑफिस वर्क (Office Work) एक्सेस</h3>
                <p class="text-xs text-slate-500">सभी 21 साइट्स, पूरे स्टॉक, पत्रांक पंजी और वित्तीय रिपोर्ट्स का नियंत्रण</p>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-900 mb-1 font-medium">ऑफिस वर्क पासवर्ड (Password) *</label>
                <input type="password" id="ownerPinInput" required placeholder="पासवर्ड दर्ज करें"
                       class="w-full px-3.5 py-3 rounded-xl bg-white border border-slate-300 text-slate-900 text-center text-lg tracking-normal font-bold focus:ring-2 focus:ring-emerald-600">
            </div>

            <button type="submit" id="ownerLoginBtn" class="w-full btn-cta">
                <i class="fa-solid fa-lock-open"></i>
                <span>ऑफिस वर्क खोलें &rarr;</span>
            </button>
        </form>

    </div>

    <!-- Security Note -->
    <div class="text-center mt-6 text-xs text-[#4B6B57] max-w-sm">
        लॉगिन केवल 1 बार करना है, ब्राउज़र में आपका डेटा सुरक्षित रूप से याद रहेगा।
    </div>

    <script>
        function switchTab(tab) {
            const tabs = ['worker', 'supervisor', 'owner'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}Btn`);
                const form = document.getElementById(`${t}Form`);
                if (t === tab) {
                    btn.className = 'py-2.5 rounded-xl bg-indigo-600 text-white shadow-sm transition';
                    if (t === 'supervisor') btn.className = 'py-2.5 rounded-xl bg-teal-600 text-white shadow-sm transition';
                    if (t === 'owner') btn.className = 'py-2.5 rounded-xl bg-[#166534] text-white font-bold shadow-sm transition';
                    form.classList.remove('hidden');
                } else {
                    btn.className = 'py-2.5 rounded-xl text-[#4B6B57] hover:text-white transition';
                    form.classList.add('hidden');
                }
            });
        }

        // 1. Worker Login Submit
        async function handleWorkerLogin(e) {
            e.preventDefault();
            const siteId = document.getElementById('wSiteId').value;
            const role = document.getElementById('wRole').value;
            const name = document.getElementById('wName').value.trim();
            const phone = document.getElementById('wPhone').value.trim();

            const btn = document.getElementById('wLoginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> लॉगिन हो रहा है...';

            try {
                const res = await fetch('/api/auth/worker-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ site_id: siteId, role: role, name: name, phone: phone })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('sandip_user_role', 'worker');
                    localStorage.setItem('sandip_worker_token', data.worker.worker_token);
                    window.location.href = '/my-attendance';
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (err) {
                alert('❌ नेटवर्क एरर: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> <span>लॉगिन करें (मेरी हाजिरी)</span>';
            }
        }

        // 2. Supervisor Login Submit with GPS Attendance Check-in
        async function handleSupervisorLogin(e) {
            e.preventDefault();
            const siteId = document.getElementById('supSiteId').value;
            const role = document.getElementById('supRole').value;
            const name = document.getElementById('supName').value.trim();
            const phone = document.getElementById('supPhone').value.trim();

            const btn = document.getElementById('supLoginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-location-crosshairs animate-pulse"></i> GPS लोकेशन जांच हो रही है...';

            let lat = null, lng = null;
            if ("geolocation" in navigator) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {
                            enableHighAccuracy: true,
                            timeout: 3000,
                            maximumAge: 0
                        });
                    });
                    lat = pos.coords.latitude;
                    lng = pos.coords.longitude;
                } catch(ge) {
                    // Geolocation denied or timed out
                }
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> लॉगिन व हाजिरी दर्ज हो रही है...';

            try {
                const res = await fetch('/api/auth/supervisor-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        site_id: siteId, 
                        role: role, 
                        name: name, 
                        phone: phone,
                        latitude: lat,
                        longitude: lng
                    })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('sandip_user_role', 'supervisor');
                    if (data.worker && data.worker.worker_token) {
                        localStorage.setItem('sandip_worker_token', data.worker.worker_token);
                    }
                    window.location.href = '/stock?site_id=' + siteId;
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (err) {
                alert('❌ ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-boxes-stacked"></i> <span>सुपरवाइज़र पोर्टल (स्टॉक व दैनिक एंट्री)</span>';
            }
        }

        // 3. Owner Login Submit
        async function handleOwnerLogin(e) {
            e.preventDefault();
            const pin = document.getElementById('ownerPinInput').value.trim();

            const btn = document.getElementById('ownerLoginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> जांच हो रही है...';

            try {
                const res = await fetch('/api/owner/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: pin })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('sandip_user_role', 'owner');
                    window.location.href = '/dashboard';
                } else {
                    alert(data.message || '❌ गलत पासवर्ड!');
                }
            } catch (err) {
                alert('❌ नेटवर्क एरर: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-lock-open"></i> <span>ऑफिस वर्क खोलें &rarr;</span>';
            }
        }
    </script>
</body>
</html>
