name: Daytime Keep-Alive & Morning Wakeup (05:30 AM to 11:30 PM IST)

on:
  schedule:
    # 00:00 to 18:00 UTC = 05:30 AM to 11:30 PM IST (Daytime working hours)
    # Ping every 10 minutes from external GitHub runners so Render NEVER enters idle sleep mode!
    - cron: '*/10 0-18 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Ping Render Live Service
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live Service
        run: |
          echo "Pinging M/S Sandip Kumar Tracker on Render..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 60 "https://sandipkumar-tracker-i4ub.onrender.com/api/live-status" || echo "FAIL")
          echo "Target response HTTP code: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "SUCCESS: Server is warm and responsive."
          else
            echo "NOTICE: Wakeup signal dispatched (HTTP $STATUS)."
          fi
