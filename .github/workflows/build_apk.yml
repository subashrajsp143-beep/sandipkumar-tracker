name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Sandip Kumar Tracker APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android Debug APK
        run: |
          cd android-app
          gradle assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk SandipKumarTracker.apk
          ls -lh SandipKumarTracker.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandipKumarTracker-APK
          path: SandipKumarTracker.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0-apk
          name: "📲 M/S Sandip Kumar Android App (APK)"
          body: |
            ### 📱 M/S Sandip Kumar - Jal Jeevan Mission Android App
            
            - **App Name:** M/S Sandip Kumar
            - **Version:** 1.0.0 (Build 1)
            - **Covered Features:**
              - 21 Sites Inventory & Live Stock Balance Register
              - 1 KM Ward Geo-Attendance & Real-Time Worker Pings
              - Jal Jeevan Mission Site Work Photos with Auto-Watermark & A4 4-Photo Album
              - Live Material Store (270+ Products) & Daily Consumption Entry
            
            #### 📥 Download & Install:
            Click below to download `SandipKumarTracker.apk` and install it on any Android mobile phone.
          files: SandipKumarTracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
